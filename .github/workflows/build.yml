name: Build Android
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK components
        shell: pwsh
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Test and build
        shell: pwsh
        run: ./build.ps1 -Jdk $env:JAVA_HOME -AndroidSdk $env:ANDROID_HOME
